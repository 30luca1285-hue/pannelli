<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Energia">
<link rel="manifest" href="manifest.json">
<title>Energia — Galluzzi</title>
<style>
  html,body{margin:0;height:100%;background:#0f1720;color:#e8eef5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* la status bar di iOS (ora, 5G, batteria) copriva l'intestazione dei tab.
     Il margine va messo QUI: dentro un iframe env(safe-area-inset-*) vale 0. */
  .shell{display:flex;flex-direction:column;height:100dvh;box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px)}
  .tabbar{display:flex;gap:4px;padding:3px 8px calc(3px + env(safe-area-inset-bottom,0px));
    background:#141d27;border-top:1px solid #243140;order:2}
  .tabbar button{flex:1;border:0;background:transparent;color:#7a8ba0;font-size:11.5px;font-weight:600;
    padding:4px 4px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1}
  .tabbar button .ic{font-size:12px;opacity:.8}
  .tabbar button.on{color:#36c98d;background:rgba(54,201,141,.12)}
  .tabbar button.on .ic{opacity:1}
  /* la status bar di iOS (ora, 5G, batteria) copriva l'intestazione dei tab: gli iframe partono
     sotto la safe area. Va messo QUI, nella shell: dentro un iframe env(safe-area-inset-*) è 0. */
  .frames{flex:1;position:relative;order:1}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f1720}
  .frames iframe.hide{display:none}
  .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#90a2b6;font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <div class="frames">
    <div class="ld" id="ld">Carico…</div>
    <iframe id="fSol" title="Solare"></iframe>
    <iframe id="fCli" class="hide" title="Clima"></iframe>
    <iframe id="fAut" class="hide" title="Auto"></iframe>
  </div>
  <div class="tabbar">
    <button id="bSol" class="on" onclick="go('sol')"><span class="ic">☀️</span>Solare</button>
    <button id="bCli" onclick="go('cli')"><span class="ic">🌡️</span>Clima</button>
    <button id="bAut" onclick="go('aut')"><span class="ic">⚡</span>Auto</button>
  </div>
</div>
<script>
  // ☀️ Solare = nuova pagina locale solar.html (era iframe Google Apps Script, sostituito 11/07/2026 — niente più ritardi)
  const fSol=document.getElementById('fSol'), fCli=document.getElementById('fCli'),
        fAut=document.getElementById('fAut'), ld=document.getElementById('ld');
  const F={sol:fSol,cli:fCli,aut:fAut}, SRC={sol:'solar.html',cli:'clima.html',aut:'auto.html'};
  let loaded={sol:false,cli:false,aut:false};
  function load(which){
    if(loaded[which])return;
    F[which].src=SRC[which];loaded[which]=true;
    if(which==='sol')fSol.onload=()=>ld.style.display='none';
  }
  function go(which){
    for(const k of ['sol','cli','aut']){
      document.getElementById('b'+k[0].toUpperCase()+k.slice(1)).classList.toggle('on',k===which);
      F[k].classList.toggle('hide',k!==which);
    }
    load(which);
    if(which!=='sol'||loaded.sol)ld.style.display='none';
    try{localStorage.setItem('energia_tab',which);}catch(e){}
  }
  let init='sol'; try{const t=localStorage.getItem('energia_tab');if(t)init=t;}catch(e){}
  go(init);
</script>
</body>
</html>
